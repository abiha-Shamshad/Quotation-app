<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation Generator — Gulf Borders For Contracting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══════════════════ APP BAR ══════════════════ -->
<header class="appbar no-print">
  <div class="brandmark">
    <span class="bm-badge">JB</span>
    <span class="bm-text">
      <b>Quotation</b>
      <i id="docStatus">New quotation</i>
    </span>
  </div>

  <div class="bar-actions">
    <button class="btn edit-only" data-act="history" title="Saved quotations">Saved</button>
    <button class="btn edit-only" data-act="save" title="Save and see the quotation (Ctrl+S)">Save</button>
    <button class="btn doc-only" data-act="edit" title="Back to the form (Esc)">← Edit</button>
    <button class="btn btn-gold" data-act="pdf" title="See it, then save as PDF or print (Ctrl+P)">PDF / Print</button>

    <details class="menu">
      <summary title="More">⋯</summary>
      <div class="menu-list">
        <button class="only-mobile" data-act="history">Saved quotations</button>
        <button data-act="new">New quotation</button>
        <button data-act="duplicate">Duplicate this one</button>
        <button data-act="settings">Company profile</button>
      </div>
    </details>
  </div>
</header>

<!-- ══════════════════ WORKSPACE ══════════════════ -->
<main class="workspace">

  <!-- ───────── EDITOR ───────── -->
  <section class="editor no-print" id="editor">

    <section class="card">
      <h2 class="card-title">Details</h2>
      <div class="card-body" id="infoEditor"></div>
    </section>

    <section class="card">
      <h2 class="card-title">Items <span class="hint" id="itemsCount"></span></h2>
      <div class="card-body">
        <div id="itemsEditor" class="items-editor"></div>
        <button class="wide-add" data-act="add-row">＋ Add item</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Totals</h2>
      <div class="card-body">
        <div class="totals-box">
          <label class="field vat">
            <span>VAT %</span>
            <input type="number" step="0.01" id="vatInput" inputmode="decimal">
          </label>
          <div class="calc-readout">
            <div><em>Sub Total</em><b id="roSub">0</b></div>
            <div><em>VAT amount</em><b id="roVat">0</b></div>
            <div class="grand"><em>Total Amount</em><b id="roTotal">0</b></div>
          </div>
        </div>
      </div>
    </section>

    <details class="card adv">
      <summary>Advanced <span class="hint">labels &amp; columns</span></summary>
      <div class="card-body" id="advEditor"></div>
    </details>

    <div class="editor-foot">
      <button class="btn btn-navy block" data-act="save">Save &amp; view quotation</button>
    </div>
  </section>

  <!-- ───────── PREVIEW ───────── -->
  <section class="preview" id="preview">
    <div class="zoombar no-print">
      <span class="zhint">This is exactly what prints.</span>
      <button class="zbtn" id="zoomToggle">Zoom 100%</button>
    </div>
    <div class="page-holder" id="pageHolder">
      <!-- the printed document -->
      <div class="page" id="page"></div>
    </div>
  </section>

</main>

<!-- ══════════════════ COMPANY PROFILE PANEL ══════════════════ -->
<div class="overlay no-print" id="settingsPanel" hidden>
  <div class="sheet">
    <header class="sheet-head">
      <h2>Company profile</h2>
      <button class="x" data-close>✕</button>
    </header>
    <div class="sheet-body">
      <p class="note">Saved once and reused on every quotation.</p>

      <div class="uploads">
        <label class="upload">
          <span>Logo</span>
          <div class="up-prev" id="logoPrev"></div>
          <input type="file" accept="image/*" id="logoFile" hidden>
          <span class="up-btns">
            <button class="chip" data-pick="logoFile">Upload</button>
            <button class="chip" data-clear="logo">Reset</button>
          </span>
        </label>
        <label class="upload">
          <span>Stamp / seal</span>
          <div class="up-prev round" id="stampPrev"></div>
          <input type="file" accept="image/*" id="stampFile" hidden>
          <span class="up-btns">
            <button class="chip" data-pick="stampFile">Upload</button>
            <button class="chip" data-clear="stamp">Reset</button>
          </span>
        </label>
      </div>

      <div class="field-grid">
        <label class="field"><span>Company name (Arabic)</span><input id="p_nameAr" dir="rtl"></label>
        <label class="field"><span>Company name (English)</span><input id="p_nameEn"></label>
        <label class="field"><span>Default contractor telephone</span><input id="p_tel" inputmode="tel"></label>
        <label class="field"><span>Footer phone 1</span><input id="p_phone1" inputmode="tel"></label>
        <label class="field"><span>Footer phone 2</span><input id="p_phone2" inputmode="tel"></label>
        <label class="field"><span>Email</span><input id="p_email" inputmode="email"></label>
        <label class="field wide"><span>Address</span><input id="p_address" dir="rtl"></label>
        <label class="field"><span>Brand navy</span><input type="color" id="p_navy"></label>
        <label class="field"><span>Brand gold</span><input type="color" id="p_gold"></label>
      </div>
    </div>
    <footer class="sheet-foot">
      <button class="btn" data-close>Close</button>
      <button class="btn btn-navy" data-act="save-profile">Save profile</button>
    </footer>
  </div>
</div>

<!-- ══════════════════ HISTORY PANEL ══════════════════ -->
<div class="overlay no-print" id="historyPanel" hidden>
  <div class="sheet">
    <header class="sheet-head">
      <h2>Saved quotations</h2>
      <button class="x" data-close>✕</button>
    </header>
    <div class="sheet-body">
      <input class="search" id="histSearch" placeholder="Search by Ref. No., client or date…">
      <div id="histList" class="hist-list"></div>
    </div>
    <footer class="sheet-foot">
      <button class="btn" data-close>Close</button>
    </footer>
  </div>
</div>

<div class="toast no-print" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
